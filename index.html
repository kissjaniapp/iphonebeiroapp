<!DOCTYPE html>
<html lang="hu"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Eredmény beíró">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><title>Eredmény beíró</title>
<style>
:root{--bg:#0f0f1a;--card:#1a1a2e;--ac:#00d4aa;--ac2:#4cc9f0;--bad:#ff6b6b;--tx:#e8e8e8;--mu:#888;--in:#252540;--bd:#333355}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:12px 12px 80px;line-height:1.4}
h1{font-size:1.25rem;text-align:center;margin-bottom:10px;color:var(--ac)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
label,.mu{font-size:.75rem;color:var(--mu)}
label{display:block;margin-bottom:4px}
input{width:100%;padding:11px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font-size:1.05rem}
select{width:100%;padding:12px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font-size:1.05rem}
input:focus{border-color:var(--ac)}
.gp{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:12px}
input:focus{outline:none;border-color:var(--ac)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{flex:1;min-width:100px;padding:13px 10px;border:0;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.p{background:var(--ac);color:#000}.n{background:var(--ac2);color:#000}.s{background:var(--in);color:var(--tx);border:1px solid var(--bd)}.v{background:#6c5ce7;color:#fff}
.m{border:2px solid var(--bd);background:var(--in);color:var(--tx)}
.m.on{border-color:var(--ac);color:var(--ac);background:rgba(0,212,170,.15)}
.step{display:flex;align-items:center;gap:10px}.step b{font-size:1.6rem;min-width:44px;text-align:center}.step button{flex:0 0 52px;min-width:0}
.hd{text-align:center;margin-bottom:10px}.hd .ph{font-size:.8rem;color:var(--mu);text-transform:uppercase;letter-spacing:1px}.hd .nu{font-size:1.8rem;font-weight:800;color:var(--ac2)}
.rw{background:var(--in);border-radius:12px;padding:10px;margin-bottom:8px}
.rw .nm{font-weight:700;margin-bottom:6px}
.rw input{background:var(--card);text-align:center;font-size:1.25rem;font-weight:600;padding:12px 6px}
.lv{font-size:.8rem;color:var(--mu);margin-top:6px}
.ok{color:var(--ac)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;color:var(--mu);font-size:.7rem;padding:4px;border-bottom:1px solid var(--bd)}
td{padding:7px 4px}tr:nth-child(even){background:rgba(255,255,255,.03)}
.hidden{display:none!important}
</style></head><body>

<div id="setup" class="card">
  <div class="g2">
    <div><label>Futamok (csoportok) száma</label><div class="step"><button class="s" onclick="setF(-1)">−</button><b id="nf">1</b><button class="s" onclick="setF(1)">+</button></div></div>
    <div><label>Dátum</label><input type="date" id="datum"></div>
  </div>
  <div id="groups"></div>
  <label style="margin-top:12px">Mód</label>
  <div class="g2"><button class="m on" id="m-both" onclick="setMode('both')">Gyakorló + Éles futam</button><button class="m" id="m-eles" onclick="setMode('eles')">Csak éles futam</button></div>
  <label style="margin-top:12px">Számolás</label>
  <div class="g2"><button class="m on" id="t-ido" onclick="setTime(true)">Pont + Idő</button><button class="m" id="t-pont" onclick="setTime(false)">Csak pont</button></div>
  <div class="row"><button class="p" onclick="start()">▶ Kezdés</button></div>
</div>

<div id="run" class="hidden">
  <div class="card">
    <div class="hd"><div class="ph" id="ph"></div><div class="nu" id="nu"></div></div>
    <div id="rows"></div>
    <div class="row"><button class="s" id="bb" onclick="go(-1)">← Vissza</button><button class="n" id="bn" onclick="go(1)">Következő →</button></div>
  </div>
  <div class="card">
    <div class="mu" id="rt" style="font-weight:600;margin-bottom:8px"></div>
    <table><thead id="rh"></thead><tbody id="rb"></tbody></table>
  </div>
</div>

<div id="done" class="hidden">
  <div class="card">
    <div id="fbox" class="hidden" style="margin-bottom:10px"><label>Futam</label><select id="fsel" onchange="pickF()"></select></div>
    <div class="mu" id="ft" style="font-weight:600;margin-bottom:8px">🏆 Végeredmény</div>
    <table><thead><tr><th>#</th><th>Név</th><th>Pont</th><th id="fti">Idő</th><th>Végered.</th></tr></thead><tbody id="fb"></tbody></table>
    <div id="allbox" class="hidden" style="margin-top:16px"><div class="mu" style="font-weight:600;margin-bottom:8px">🏁 Összesített állás – összes futam eddig</div>
    <table><thead id="ah"></thead><tbody id="ab"></tbody></table></div>
    <label style="margin-top:14px">Kinek az eredményét mentsük / küldjük?</label>
    <select id="who"></select>
    <div class="row"><button class="p" onclick="doSave()">📷 Mentés a telefonra</button></div>
    <div class="row hidden" id="bw"><button class="n" onclick="webShare()">📤 Küldés – Messenger, Viber…</button></div>
    <div class="mu hidden" id="iosh" style="margin-top:8px">iPhone: a megnyíló ablakban koppints a „Kép mentése” gombra, így a Fotók közé kerül. Küldésnél válaszd ki a Messengert vagy a Vibert.</div>
    <div class="row hidden" id="bs"><button class="n" onclick="doSend('com.facebook.orca','Messenger')">💬 Küldés Messengerrel</button><button class="v" onclick="doSend('com.viber.voip','Viber')">📞 Küldés Viberrel</button></div>
    <div class="row"><button class="p hidden" id="bnf" onclick="nextF()">Következő futam →</button></div>
    <div class="row"><button class="s" onclick="back()">← Utolsó kör</button><button class="v" onclick="restart()">🆕 Új verseny</button></div>
  </div>
</div>

<script>
const GK=3,EK=9;
let FN=[4],futams=[],fi=0,names=[],mode='both',ph='gyak',ri=0,ci=0,useTime=true,D={gyak:[],eles:[]};
const $=id=>document.getElementById(id),f2=x=>x.toFixed(2),eq=(a,b)=>Math.abs(a-b)<1e-9;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=i=>names[i]||`Versenyző ${i+1}`, mx=()=>ph=='gyak'?GK:EK;
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
$('datum').valueAsDate=new Date();

function drawSetup(){
  const old=FN.map((n,f)=>[...document.querySelectorAll(`.nmi[data-f="${f}"]`)].map(e=>e.value));
  $('nf').textContent=FN.length;
  $('groups').innerHTML=FN.map((n,f)=>`<div class="gp"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><b>${FN.length>1?(f+1)+'. futam':'Versenyzők'}</b><div class="step"><button class="s" onclick="setN(${f},-1)">−</button><b>${n}</b><button class="s" onclick="setN(${f},1)">+</button></div></div>`+Array.from({length:n},(_,i)=>`<input class="nmi" data-f="${f}" style="margin-bottom:6px" placeholder="${i+1}. versenyző neve" value="${esc((old[f]&&old[f][i])||'')}">`).join('')+'</div>').join('');
}
function setF(d){
  const n=Math.min(10,Math.max(1,FN.length+d));
  while(FN.length<n)FN.push(FN[FN.length-1]);
  FN.length=n;drawSetup();
}
function setN(f,d){FN[f]=Math.min(30,Math.max(1,FN[f]+d));drawSetup()}
function setMode(m){mode=m;$('m-both').classList.toggle('on',m=='both');$('m-eles').classList.toggle('on',m=='eles')}
function setTime(b){useTime=b;$('t-ido').classList.toggle('on',b);$('t-pont').classList.toggle('on',!b)}
drawSetup();

function show(id){['setup','run','done'].forEach(s=>$(s).classList.toggle('hidden',s!=id))}
function start(){
  futams=FN.map((n,f)=>({names:[...document.querySelectorAll(`.nmi[data-f="${f}"]`)].map(e=>e.value.trim()),D:{gyak:[],eles:[]}}));
  load(0);ph=mode=='both'?'gyak':'eles';ri=0;ci=0;show('run');render();
}
function load(k){fi=k;names=futams[k].names;D=futams[k].D}
const fpre=()=>futams.length>1?`${fi+1}. futam · `:'';
const calc=(p,i,g)=>useTime?({p,i,r:p+i,v:g?i>0:i>=0}):({p,i:0,r:p,v:true});

function cum(p,c,u=99){let s=0,n=0;for(let k=0;k<=u&&k<D[p].length;k++){const e=D[p][k]&&D[p][k][c];if(e&&e.v){s+=e.r;n++}}return{s,n}}
function tot(c,DD=D){let s=0,pp=0,ii=0;DD.eles.forEach(R=>{const e=R&&R[c];if(e&&e.v){s+=e.r;pp+=e.p;ii+=e.i}});return{c,s,pp,ii}}
const played=F=>F.D.eles.some(R=>R&&R.some(Boolean));
function allRows(){
  const a=[];
  futams.forEach((F,f)=>{if(played(F))F.names.forEach((_,c)=>{const t=tot(c,F.D);a.push({c,D:F.D,fut:f+1,name:F.names[c]||`Versenyző ${c+1}`,s:t.s,pp:t.pp,ii:t.ii})})});
  a.sort((x,y)=>y.s-x.s||y.ii-x.ii);
  a.forEach((x,i)=>x.pl=i&&eq(a[i-1].s,x.s)&&eq(a[i-1].ii,x.ii)?a[i-1].pl:i+1);
  return a;
}
const withF=(f,fn)=>{const o=fi;load(f);try{return fn()}finally{load(o)}};
function ranking(){const a=names.map((_,c)=>tot(c)).sort((x,y)=>y.s-x.s||y.ii-x.ii);a.forEach((x,i)=>{x.pl=i&&eq(a[i-1].s,x.s)&&eq(a[i-1].ii,x.ii)?a[i-1].pl:i+1});return a}

function render(){
  const g=ph=='gyak',e=(D[ph][ri]||[])[ci],last=ci==names.length-1;
  $('ph').textContent=`${fpre()}${g?'Gyakorló':'Éles'} · ${ri+1}/${mx()}. kör · ${ci+1}/${names.length}. versenyző`;
  $('nu').textContent=nm(ci);
  const more=ri<mx()-1||(g&&mode=='both');
  const hint=!last?`Következő: ${nm(ci+1)}`:more?`Utána új kör: ${nm(0)} indul`:'Ő az utolsó';
  $('rows').innerHTML=`<div class="rw"><div class="${useTime?'g2':''}">
    <div><label>Pont</label><input type="number" class="ip" step="1" inputmode="numeric" placeholder="0" value="${e?e.p:''}"></div>
    ${useTime?(ios?`<div><label>Megtakarított idő</label><div style="display:flex;gap:6px"><button class="s" style="flex:0 0 52px;min-width:0;padding:0" onclick="flipSign()">±</button><input type="text" class="ip" inputmode="decimal" placeholder="0.00" value="${e?e.i:''}"></div></div>`:`<div><label>Megtakarított idő</label><input type="number" class="ip" step="0.01" inputmode="decimal" placeholder="0.00" value="${e?e.i:''}"></div>`):''}</div>
    <div class="lv" id="lv"></div></div><div class="mu" style="text-align:center;margin-bottom:8px">${esc(hint)}</div>`;
  $('bb').style.visibility=(ri==0&&ci==0&&(g||mode=='eles'))?'hidden':'visible';
  $('bn').textContent=!last?'Következő versenyző →':(!g&&ri==EK-1)?'Befejezés ✓':g&&ri==GK-1?'Éles futam →':'Következő kör →';
  refresh();window.scrollTo(0,0);document.querySelector('.ip').focus();
}
function sync(){
  const ips=document.querySelectorAll('.ip'),p=num(ips[0].value),i=useTime?num(ips[1].value):0,R=D[ph][ri]||[];
  R[ci]=p!==null&&i!==null?calc(p,i,ph=='gyak'):null;D[ph][ri]=R;
}
function refresh(){
  const g=ph=='gyak',e=(D[ph][ri]||[])[ci];
  $('lv').innerHTML=e?`${useTime?`Rész <b>${f2(e.r)}</b> · `:''}<span class="${e.v?'ok':'bad'}">${e.v?'Érvényes':'Kifutott'}</span> · Göngy. <b>${f2(cum(ph,ci,ri).s)}</b>`:'–';
  $('rt').textContent=g?'Gyakorló állás':'Éles állás';
  $('rh').innerHTML=`<tr><th>#</th><th>Név</th><th>Göngy.</th>${g?'':`<th>Átlagod, ha így lősz továbbra is</th>`}</tr>`;
  const a=names.map((_,c)=>{const q=cum(ph,c,ri);return{c,s:q.s,n:q.n}}).sort((x,y)=>y.s-x.s);
  a.forEach((x,i)=>x.pl=i&&eq(a[i-1].s,x.s)?a[i-1].pl:i+1);
  $('rb').innerHTML=a.map(x=>`<tr><td>${x.pl}.</td><td>${esc(nm(x.c))}</td><td><b>${f2(x.s)}</b></td>${g?'':`<td class="mu">${x.n?f2(x.s+(EK-x.n)*x.s/x.n):'–'}</td>`}</tr>`).join('');
}
$('rows').addEventListener('input',()=>{sync();refresh()});
$('rows').addEventListener('keydown',e=>{
  if(e.key!='Enter')return;e.preventDefault();
  const ips=document.querySelectorAll('.ip');useTime&&e.target==ips[0]?ips[1].focus():go(1);
});
function flipSign(){
  const i=document.querySelectorAll('.ip')[1];if(!i)return;
  i.value=i.value.startsWith('-')?i.value.slice(1):'-'+i.value;
  i.dispatchEvent(new Event('input',{bubbles:true}));i.focus();
}
function go(d){
  const ips=[...document.querySelectorAll('.ip')];
  if(d>0){
    const a=num(ips[0].value)!==null,b=useTime?num(ips[1].value)!==null:a;
    if(a!==b){alert('Írd be a pontot és az időt is!');(a?ips[1]:ips[0]).focus();return}
    if(!a&&!confirm(`${nm(ci)}: nincs adat. Kihagyod?`))return;
  }
  sync();
  if(d>0){
    if(ci<names.length-1)ci++;
    else{ci=0;if(ri<mx()-1)ri++;else if(ph=='gyak'&&mode=='both'){ph='eles';ri=0}else return finish()}
  }else if(ci>0)ci--;
  else if(ri>0){ri--;ci=names.length-1}
  else if(ph=='eles'&&mode=='both'){ph='gyak';ri=GK-1;ci=names.length-1}
  render();
}
function finish(){
  show('done');
  $('fbox').classList.toggle('hidden',futams.length<2);
  $('fsel').innerHTML=futams.map((_,k)=>`<option value="${k}"${k==fi?' selected':''}>${k+1}. futam</option>`).join('');
  $('ft').textContent=futams.length>1?`🏆 ${fi+1}. futam végeredménye`:'🏆 Végeredmény';
  $('bnf').classList.toggle('hidden',fi>=futams.length-1);
  $('fti').style.display=useTime?'':'none';
  $('fb').innerHTML=ranking().map(x=>`<tr><td>${['🥇','🥈','🥉'][x.pl-1]||x.pl+'.'}</td><td>${esc(nm(x.c))}</td><td>${x.pp}</td>${useTime?`<td>${f2(x.ii)}</td>`:''}<td class="ok"><b>${f2(x.s)}</b></td></tr>`).join('');
  if(native)$('bs').classList.remove('hidden');
  else if(ios&&canShareFiles()){$('bw').classList.remove('hidden');$('iosh').classList.remove('hidden')}
  const multi=futams.length>1,rk=ranking(),pf=futams.filter(played).length,medal=p=>['🥇','🥈','🥉'][p-1]||p+'.';
  $('allbox').classList.toggle('hidden',!multi);
  if(multi){
    const ar=allRows();
    $('ah').innerHTML=`<tr><th>#</th><th>Név</th><th>Futam</th><th>Pont</th>${useTime?'<th>Idő</th>':''}<th>Végered.</th></tr>`;
    $('ab').innerHTML=ar.map(x=>`<tr><td>${medal(x.pl)}</td><td>${esc(x.name)}</td><td>${x.fut}.</td><td>${x.pp}</td>${useTime?`<td>${f2(x.ii)}</td>`:''}<td class="ok"><b>${f2(x.s)}</b></td></tr>`).join('');
  }
  const O=[];
  if(multi)O.push(['allF','🏁 Összesített – összes futam, egy sorrendben']);
  O.push(['all',multi?'📋 Ez a futam sorrendje':'📋 Összesített sorrend']);
  if(multi)O.push(['byF',`📚 Minden futam sorrendje külön (${pf} kép)`]);
  if(names.length>1)O.push(['each',multi?'👥 Ennek a futamnak minden versenyzője külön':`👥 Mindenki külön (${names.length} kép)`]);
  if(multi)O.push(['eachAll',`👥 Minden futam minden versenyzője külön (${futams.filter(played).reduce((a,F)=>a+F.names.length,0)} kép)`]);
  rk.forEach(r=>O.push([r.c,`${r.pl}. ${nm(r.c)}${multi?` (${fi+1}. futam)`:''}`]));
  $('who').innerHTML=O.map(o=>`<option value="${o[0]}">${esc(o[1])}</option>`).join('');
}
function pickF(){load(+$('fsel').value);finish()}
function nextF(){load(fi+1);ph=mode=='both'?'gyak':'eles';ri=0;ci=0;show('run');render()}
function back(){show('run');ph='eles';ri=EK-1;ci=names.length-1;render()}
function restart(){if(confirm('Új verseny kezdése? Az összes futam eredménye törlődik (ha nem mentetted).'))show('setup')}

/* ---- JPEG ---- */
function img(list,head,sub){
  const rk=list||ranking().map(r=>({...r,name:nm(r.c),D})),both=mode=='both',cols=[];
  if(both)for(let k=0;k<GK;k++)cols.push(['G'+(k+1),'gyak',k]);
  for(let k=0;k<EK;k++)cols.push(['É'+(k+1),'eles',k]);
  const cw=96,pw=64,nw=rk.some(r=>r.fut)?310:240,tw=120,m=30,rh=60,tn=useTime?3:1,W=m*2+pw+nw+cols.length*cw+tn*tw,H=140+rh*(rk.length+1)+m;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const F='"Segoe UI",Roboto,Arial,sans-serif';
  const T=(t,px,py,font,col,al)=>{x.font=font+' '+F;x.fillStyle=col;x.textAlign=al||'left';x.fillText(t,px,py)};
  x.fillStyle='#0f0f1a';x.fillRect(0,0,W,H);
  T(head||'Eredménytáblázat',m,52,'bold 34px','#00d4aa');
  T(`${sub===undefined?fpre():sub}${$('datum').value||''} · ${both?'Gyakorló + Éles futam':'Csak éles futam'} · ${rk.length} versenyző${useTime?'':' · csak pont'}`,m,90,'20px','#aaa');
  const tx=m+pw+nw+cols.length*cw;
  let y=110;
  x.fillStyle='#252540';x.fillRect(m,y,W-2*m,rh);
  T('#',m+pw/2,y+38,'bold 18px','#888','center');T('Név',m+pw,y+38,'bold 18px','#888');
  cols.forEach((c,k)=>T(c[0],m+pw+nw+k*cw+cw/2,y+38,'bold 18px',c[1]=='gyak'?'#777':'#4cc9f0','center'));
  (useTime?['Össz pont','Össz idő','Végeredmény']:['Végeredmény']).forEach((t,k)=>T(t,tx+k*tw+tw/2,y+38,'bold 18px','#888','center'));
  const medal=['#ffd93d','#cfd8dc','#e29a5b'];
  rk.forEach((r,i)=>{
    y=110+rh*(i+1);
    if(i%2){x.fillStyle='rgba(255,255,255,.04)';x.fillRect(m,y,W-2*m,rh)}
    T(r.pl+'.',m+pw/2,y+38,'bold 24px',medal[r.pl-1]||'#e8e8e8','center');
    let n=r.name+(r.fut?`  · ${r.fut}. futam`:'');x.font='bold 22px '+F;while(x.measureText(n).width>nw-12&&n.length>1)n=n.slice(0,-1);
    T(n,m+pw,y+38,'bold 22px','#e8e8e8');
    cols.forEach((c,k)=>{
      const e=r.D[c[1]][c[2]]&&r.D[c[1]][c[2]][r.c],cx=m+pw+nw+k*cw+cw/2,g=c[1]=='gyak';
      if(e){T(f2(e.r),cx,useTime?y+27:y+37,'bold 20px',e.v?(g?'#99a':'#fff'):'#ff6b6b','center');if(useTime)T(`${e.p} | ${f2(e.i)}`,cx,y+48,'13px','#888','center')}
      else T('–',cx,y+36,'20px','#555','center');
    });
    if(useTime){T(String(r.pp),tx+tw/2,y+38,'22px','#e8e8e8','center');T(f2(r.ii),tx+tw*1.5,y+38,'22px','#e8e8e8','center')}
    T(f2(r.s),tx+tw*(tn-.5),y+39,'bold 26px','#00d4aa','center');
  });
  return cv;
}
const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const canShareFiles=()=>{try{return !!(navigator.canShare&&navigator.canShare({files:[new File(['a'],'a.jpg',{type:'image/jpeg'})]}))}catch(e){return false}};
function toFile(cv,name){const b=atob(cv.toDataURL('image/jpeg',.92).split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new File([u],name,{type:'image/jpeg'})}
function webShare(){
  const t=stamp(),files=items().map(it=>toFile(it.cv,it.name+'_'+t+'.jpg'));
  return navigator.share({files,title:'Eredmény beíró'}).catch(e=>{if(e&&e.name!='AbortError')alert('A megosztás nem sikerült: '+((e&&e.message)||e))});
}
const cap=window.Capacitor,native=!!(cap&&cap.isNativePlatform&&cap.isNativePlatform());
const nat=async(pl,me,o)=>{
  const P=cap.Plugins&&cap.Plugins[pl];
  if(P&&P[me])return P[me](o);
  if(cap.nativePromise)return cap.nativePromise(pl,me,o);
  if(cap.registerPlugin)return cap.registerPlugin(pl)[me](o);
  throw new Error('a natív híd nem érhető el');
};
const fname=()=>`eredmeny_${$('datum').value||'futam'}.jpg`;
async function putImg(cv,name){
  if(native){await nat('JpegSaver','save',{data:cv.toDataURL('image/jpeg',.92).split(',')[1],name});return}
  await new Promise(res=>cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);setTimeout(res,400)},'image/jpeg',.92));
}
const stamp=()=>new Date().toTimeString().slice(0,8).replace(/:/g,'');
const slug=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')||'versenyzo';
function items(){
  const v=$('who').value,d=$('datum').value||'futam',multi=futams.length>1,fp=multi?'_f'+(fi+1):'';
  const pf=futams.map((F,f)=>f).filter(f=>played(futams[f]));
  if(v=='allF')return [{cv:img(allRows(),'Összesített eredmény','Összes futam · '),name:`eredmeny_${d}_osszes_futam_osszesitett`}];
  if(v=='byF')return pf.map(f=>withF(f,()=>({cv:img(),name:`eredmeny_${d}_f${f+1}_osszesitett`})));
  if(v=='eachAll')return pf.flatMap(f=>withF(f,()=>ranking().map(r=>({cv:imgOne(r.c),name:`eredmeny_${d}_f${f+1}_${r.pl}_${slug(nm(r.c))}`}))));
  const rk=ranking(),one=r=>({cv:imgOne(r.c),name:`eredmeny_${d}${fp}_${r.pl}_${slug(nm(r.c))}`});
  if(v=='all')return [{cv:img(),name:`eredmeny_${d}${fp}_osszesitett`}];
  if(v=='each')return rk.map(one);
  return [one(rk.find(r=>r.c==+v))];
}
async function doSave(){
  if(!native&&ios&&canShareFiles())return webShare();
  const t=stamp(),L=items();
  try{
    for(const it of L)await putImg(it.cv,it.name+'_'+t+'.jpg');
    alert(native?`✅ ${L.length} kép elmentve a telefonra: Galéria → Eredmenytablazat album.`:`✅ ${L.length} kép letöltve.`);
  }catch(e){alert('A mentés nem sikerült: '+((e&&e.message)||e))}
}
async function doSend(pkg,label){
  const t=stamp(),L=items();
  try{
    await nat('JpegSaver','sendMany',{pkg,files:L.map(it=>({data:it.cv.toDataURL('image/jpeg',.92).split(',')[1],name:it.name+'_'+t+'.jpg'}))});
  }catch(e){alert(label+' nem nyitható meg ('+((e&&e.message)||e)+'). Telepítve van a telefonon?')}
}
function imgOne(c){
  const me=ranking().find(r=>r.c==c),both=mode=='both',secs=[];
  if(both)secs.push(['Gyakorló','gyak',GK]);secs.push(['Éles','eles',EK]);
  const cols=useTime?['Kör','Pont','Idő','Rész','Göngyölt']:['Kör','Pont','Göngyölt'];
  const W=900,m=36,rh=44,cw=(W-2*m)/cols.length,nr=secs.reduce((a,x)=>a+x[2]+1,0),H=160+rh+nr*rh+140;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const F='"Segoe UI",Roboto,Arial,sans-serif';
  const T=(t,px,py,font,col,al)=>{x.font=font+' '+F;x.fillStyle=col;x.textAlign=al||'left';x.fillText(t,px,py)};
  const cx=k=>m+cw*(k+.5);
  x.fillStyle='#0f0f1a';x.fillRect(0,0,W,H);
  T(nm(c),m,62,'bold 42px','#00d4aa');
  T(`${fpre()}${$('datum').value||''} · ${both?'Gyakorló + Éles futam':'Csak éles futam'}${useTime?'':' · csak pont'}`,m,98,'20px','#aaa');
  T(`${me.pl}. hely a(z) ${names.length} versenyzőből`,m,138,'bold 26px',['#ffd93d','#cfd8dc','#e29a5b'][me.pl-1]||'#e8e8e8');
  let y=160;
  x.fillStyle='#252540';x.fillRect(m,y,W-2*m,rh);
  cols.forEach((h,k)=>T(h,cx(k),y+30,'bold 18px','#888','center'));
  y+=rh;
  secs.forEach(sec=>{
    const g=sec[1]=='gyak';
    T(sec[0],m+8,y+30,'bold 20px',g?'#777':'#4cc9f0');y+=rh;
    for(let k=0;k<sec[2];k++){
      const e=D[sec[1]][k]&&D[sec[1]][k][c];
      if(k%2){x.fillStyle='rgba(255,255,255,.04)';x.fillRect(m,y,W-2*m,rh)}
      const col=g?'#99a':'#e8e8e8';
      T((k+1)+'.',cx(0),y+30,'20px',col,'center');
      if(e){
        let v=[String(e.p)];if(useTime)v.push(f2(e.i),f2(e.r));
        v.push(f2(cum(sec[1],c,k).s));
        v.forEach((t,j)=>T(t,cx(j+1),y+30,j==v.length-1?'bold 20px':'20px',(useTime&&j==2&&!e.v)?'#ff6b6b':col,'center'));
      }else for(let j=1;j<cols.length;j++)T('–',cx(j),y+30,'20px','#555','center');
      y+=rh;
    }
  });
  y+=14;x.fillStyle='#333355';x.fillRect(m,y,W-2*m,2);
  T('Végeredmény (éles)',m,y+50,'bold 24px','#e8e8e8');
  T(f2(me.s),W-m,y+54,'bold 44px','#00d4aa','right');
  T(useTime?`Össz pont: ${me.pp} · Össz idő: ${f2(me.ii)}`:`Összesen ${names.length} versenyző`,m,y+90,'18px','#888');
  return cv;
}
if(!native&&'serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(()=>{});
